server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rtplan-backend

  datasource:
    url: jdbc:sqlserver://${DB_HOST:db1.ads.netyx.net}:${DB_PORT:1433};databaseName=${DB_NAME:RTPlan};integratedSecurity=true;encrypt=true;trustServerCertificate=true;
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

app:
  integrations:
    gemini:
      api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
    google-maps:
      api-key: ${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}
      geocoding-url: https://maps.googleapis.com/maps/api/geocode/json
      routes-url: https://routes.googleapis.com/directions/v2:computeRoutes
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:8080"
      - "http://app1.netyx.net"
      - "https://app1.netyx.net"
      - "http://map.netyx.net"
      - "https://map.netyx.net"
      - "http://10.1.10.140"
      - "http://10.1.25.178"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
