# ==============================================================================
# Nginx Reverse Proxy Configuration for map.netyx.net
# Target Host: 10.1.25.178 (/etc/nginx/conf.d/map.netyx.net.conf)
# Upstream Application Server: app1.netyx.net (10.1.10.140:80)
# ==============================================================================

server {
    listen 80;
    server_name map.netyx.net;

    client_max_body_size 50M;

    # Forward all traffic (Vite SPA frontend + /api/ endpoints) to APP1
    location / {
        proxy_pass         http://10.1.10.140:80;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (for hot reload or real-time features)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_connect_timeout 90s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}

